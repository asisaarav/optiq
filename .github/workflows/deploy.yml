name: Deploy

on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Guarded: set repo variable DEPLOY_ENABLED=true to allow production deploys.
    # Requires secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Build (OpenNext for Cloudflare)
        run: npm run cf:build
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
